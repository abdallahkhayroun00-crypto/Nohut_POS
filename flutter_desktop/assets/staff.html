:root{--green:#123e30;--gold:#a58336;--cream:#f6f2e7;--card:#fbf9f3;--muted:#60705f;--line:#d9ddcc}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--green);font:17px/1.35 Barlow,Arial,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}button,input,select,textarea{font:inherit;color:inherit}button,a,select{touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}button{min-height:44px;padding:9px 13px;border:1px solid #bbc7af;border-radius:11px;background:var(--card);font-weight:600}button:disabled{opacity:.4;cursor:not-allowed}button:hover{background:#e8eddf}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#29553e}.danger{color:#8b3c30;border-color:#dac1b6}.ghost{border-color:transparent;background:transparent}.muted{color:var(--muted);font-size:14px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spread{justify-content:space-between}.grow{flex:1;min-width:0}[hidden]{display:none!important}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Bree,Georgia,serif;font-weight:400}h1{font-size:23px}h2{font-size:25px}h3{font-size:21px}label{display:block;font-size:14px;font-weight:600;color:var(--muted)}input,select,textarea{width:100%;min-width:0;min-height:44px;padding:9px 10px;background:#fffef9;border:1px solid #cfd5c2;border-radius:10px;margin-top:4px}textarea{min-height:76px;resize:vertical}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}header{padding:10px 14px 7px;border-bottom:2px solid var(--gold);background:var(--card);flex-shrink:0}.brand-logo{width:44px;height:44px;object-fit:contain}header label{width:135px}#connection{font-size:12px;margin:3px 0 0;color:var(--muted)}.top-nav{display:flex;gap:4px;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}.top-nav button{flex:1;border:0;background:transparent;border-radius:2 0px;border-radius:10px;font-size:14px}.cart-line,.order{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);margin:10px 0;overflow-wrap:anywhere}.cart-line-title{display:flex;justify-content:space-between;gap:10px}.cart-line strong{font-size:19px}.quantity{display:flex;gap:10px;align-items:center}.quantity button{width:42px;font-size:21px;padding:5px}.cart-line label{font-size:13px;margin-top:8px}.cart-line input{min-height:40px}.cart-line [data-line-status]{color:var(--gold);font-weight:600;margin-top:8px}.summary{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}#total{font-family:Barlow;font-weight:700;font-size:26px}#submit{width:100%;margin-top:12px;min-height:49px}#orders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.order .order-number{font:23px Bree,Georgia,serif}.badge{padding:4px 9px;border-radius:20px;background:#e8e3cf;color:#6d5924;font-size:13px}.badge.ready{background:#dce9d3;color:var(--green)}.order .row+div{margin-top:10px}.detail-line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.detail-line .line-price{font-weight:600;color:var(--gold)}.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.detail-totals{padding:15px;border:1px solid var(--line);border-radius:13px;background:var(--card);margin:16px 0}.detail-totals p{display:flex;justify-content:space-between;padding:4px 0}.detail-totals p:last-child{font-size:24px;font-weight:700;border-top:1px solid var(--line);margin-top:7px;padding-top:8px}.empty{text-align:center;border:1px dashed #ccd1bd;border-radius:14px;padding:26px 15px;color:var(--muted);grid-column:1/-1}.empty strong{display:block;font:21px Bree,Georgia,serif;color:var(--green);margin-bottom:7px}#notice{padding:10px 14px;background:#fff0cf;border-bottom:1px solid #dac18d;font-size:15px;flex-shrink:0;max-height:110px;overflow:auto}#notice:empty{display:none}#notice[data-tone=success]{background:#e1ebd7}.bottom-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--green);color:var(--cream);border-top:2px solid var(--gold);padding:9px 14px calc(9px + env(safe-area-inset-bottom));flex-shrink:0}.bottom-bar small{font-size:12px;color:#d6dfcb;display:block}.bottom-bar strong{font-size:23px}.bottom-bar button{border-radius:25px;min-height:45px}.error{color:#923d31;font-size:14px;margin-top:10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}dialog{width:min(480px,calc(100% - 22px));padding:22px;border:1px solid #ccbc91;border-radius:19px;background:var(--card);color:var(--green);max-height:90dvh;overflow:auto}dialog::backdrop{background:#123e3080;backdrop-filter:blur(2px)}dialog h2{margin:0 0 17px}dialog label{margin-bottom:12px}dialog .actions{display:flex;gap:9px;margin-top:18px}dialog .actions button{flex:1}.check{display:flex;align-items:start;gap:8px;font-size:15px}.check input{width:20px;min-height:20px;margin:0;flex-shrink:0}.status-row{margin-top:8px}.select-order{width:100%;margin-top:13px}.order-controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}#reload{min-height:35px;font-size:13px;padding:4px 9px}.history-note{margin-top:12px}.hidden-on-tiny{display:inline}details summary{cursor:pointer;font-size:14px;color:var(--muted);padding:6px 0}@media(max-width:550px){#menu{grid-template-columns:1fr}.product{padding:8px 12px;min-height:76px}.product .name{font-size:18px}.product .row{justify-content:space-between}.product .custom-button{min-height:32px}.product .price{margin:0}.product .grow>.row{flex-wrap:nowrap;gap:12px}#orders{grid-template-columns:1fr}.hidden-on-tiny{display:none}}@media(min-width:1000px){body{max-width:1300px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}#menu{grid-template-columns:repeat(3,minmax(0,1fr))}.screen{padding:18px}.cart-columns{max-width:900px;margin:auto}#order-detail{max-width:900px;margin:auto}.setup-fields{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><div class="row"><img class="brand-logo" src="/assets/nohut-logo.webp" width="44" height="44" alt="Nohut Falafel"><div class="grow"><h1>Nohut <span class="hidden-on-tiny">· Sipariş</span></h1><div id="connection" role="status">Laptopa bağlanılıyor…</div></div><label><span class="sr-only">Çalışan</span><select id="staff" aria-label="Çalışan"><option value="">Adınızı seçin</option></select></label><button id="reload" class="ghost" aria-label="Bağlantıyı Yenile">↻</button></div></header>
<nav class="top-nav" aria-label="Personel bölümleri"><button data-view="menu" aria-selected="true">Ürünler</button><button data-view="cart" aria-selected="false">Sepet <span id="cart-count" class="count">0</span></button><button data-view="orders" aria-selected="false">Siparişler <span id="order-count" class="count">0</span></button></nav>
<p id="notice" role="status" aria-live="polite"></p><button id="retry" hidden>Aynı İsteği Yeniden Dene</button>
<main class="screen" data-screen="menu"><div id="target-bar" class="target-bar" hidden><div class="row"><strong id="target-label" class="grow"></strong><button id="cancel-target" class="ghost">Yeni sipariş</button></div></div><div class="setup-fields"><label>Sipariş türü<select id="source"><option>Masa</option><option>Gel-Al</option></select></label><label id="table-label">Masa<select id="table"></select></label><label id="pickup-label" hidden>Teslim alma<select id="pickup"><option>Tezgahtan</option><option>Telefon</option></select></label></div><details id="customer" hidden><summary>Müşteri / teslim saati</summary><div class="customer-fields"><label>Müşteri adı<input id="customer-name" autocomplete="name"></label><label>Telefon<input id="customer-phone" type="tel"></label><label>Teslim alma saati<input id="customer-time" type="time"></label></div></details><p id="destination"></p><label class="search-box"><input id="search" type="search" aria-label="Ürün ara" placeholder="Ürün ara…"></label><nav id="categories" aria-label="Ürün kategorileri"></nav><div id="menu"><p class="empty">Menü yükleniyor…</p></div></main>
<section class="screen" data-screen="cart" hidden><div class="cart-columns"><div class="row spread"><h2>Sipariş sepeti</h2><button data-view="menu" class="ghost">+ Ürün ekle</button></div><p id="cart-destination" class="muted"></p><div id="cart"></div><div class="summary"><h2 id="total">Toplam 0,00 ₺</h2><button id="submit" class="primary" disabled>Siparişi Laptopa Kaydet</button><p class="muted history-note">Ödeme sırasında fiş sorulur. Sipariş eklerken yazdırılmaz.</p></div></div></section>
<section class="screen" data-screen="orders" hidden><div class="row spread"><h2>Açık siparişler</h2><label>Göster<select id="order-filter"><option value="all">Tümü</option><option value="Masa">Masalar</option><option value="Gel-Al">Gel-Al</option><option value="ready">Hazır</option></select></label></div><div id="orders"></div></section>
<section class="screen" data-screen="detail" hidden><div id="order-detail"></div></section>
<aside class="bottom-bar"><div><small id="dock-caption">Sipariş sepeti · 0 ürün</small><strong id="dock-total">0,00 ₺</strong></div><button data-view="cart">Sepete git →</button></aside>
<dialog id="customize" aria-labelledby="custom-name"><form id="custom-form"><h2 id="custom-name"></h2><label>Adet (0 = kaldır)<input id="custom-qty" type="number" min="0" max="1000" value="1" required></label><label>Ürün notu<textarea id="custom-note" maxlength="500"></textarea></label><label>Çıkarılacak malzemeler<input id="custom-removed" maxlength="500" placeholder="Virgülle ayırın"></label><p id="custom-error" class="error"></p><div class="actions"><button type="button" id="custom-cancel">Vazgeç</button><button class="primary" type="submit">Kaydet</button></div></form></dialog>
<dialog id="payment-dialog" aria-labelledby="payment-heading"><form id="payment-form"><h2 id="payment-heading">Ödeme al</h2><p id="payment-due"></p><div class="form-grid"><label>Yöntem<select id="pay-method"><option>Nakit</option><option>Kart</option></select></label><label>Tutar (₺)<input id="pay-amount" inputmode="decimal" required></label><label id="cash-label" class="full">Alınan nakit (₺)<input id="pay-received" inputmode="decimal"></label><p id="cash-change" class="muted full"></p><label id="card-check" class="check full" hidden><input id="card-confirmed" type="checkbox">inPOS cihazında ödeme başarılı oldu. Bu düğme bankadan para çekmez.</label><label class="full">Fiş yazdırılsın mı?<select id="pay-print" required><option value="">Seçin…</option><option value="no">Hayır, yazdırma</option><option value="yes">Evet, hesap özeti yazdır</option></select></label></div><p id="payment-error" class="error"></p><div class="actions"><button type="button" id="pay-cancel">Vazgeç</button><button type="submit" class="primary">Ödemeyi Kaydet</button></div></form></dialog>
<dialog id="move-dialog"><form id="move-form"><h2>Masayı taşı</h2><p class="muted">Sipariş ve ödemeler aynı hesapta kalır.</p><label>Yeni masa<select id="move-table"></select></label><p id="move-error" class="error"></p><div class="actions"><button type="button" id="move-cancel">Vazgeç</button><button type="submit" class="primary">Taşı</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),cart=new Map();let state=null,revision=-1,busy=false,online=false,refreshing=false,category='all',lineId=0,customProduct=null,editing=null,view='menu',focusedOrder=null,targetOrder=null,menuSignature='',staffSignature='',tableSignature='';
let pending=null;try{const raw=JSON.parse(sessionStorage.getItem('nohut-pending')||'null');pending=raw?(raw.payload?raw:{url:'/api/staff/orders',payload:raw}):null}catch{sessionStorage.removeItem('nohut-pending')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
const number=o=>String(o.dailyNumber??o.id).padStart(4,'0');
const categoryNames={wrap:'Dürümler',plate:'Porsiyonlar',meze:'Mezeler',fatte:'Fatte',side:'Diğer',salad:'Salatalar',dessert:'Tatlılar',drink:'İçecekler'};
const openOrders=()=>state?.orders.filter(o=>!o.closed&&!o.cancelled&&!o.tableReleased&&['Masa','Gel-Al'].includes(o.source))||[];
const order=id=>openOrders().find(o=>o.id===id),product=id=>state?.localMenu.find(p=>p.id===id&&p.active!==false);
const keyedLines=o=>(o.batches||[]).flatMap(b=>(b.lines||[]).map((l,i)=>({...l,key:b.id+':'+i}))).filter(l=>!l.voided&&!l.correction);
const orderTotal=o=>o.totalCents??keyedLines(o).reduce((n,l)=>n+Math.round(l.price*100)*l.qty,0),orderDue=o=>o.dueCents??orderTotal(o);
function notice(text){$('notice').textContent=text;$('notice').dataset.tone=text.startsWith('✓')?'success':'attention'}
function setView(next){view=next;for(const el of document.querySelectorAll('[data-screen]'))el.hidden=el.dataset.screen!==next;for(const b of document.querySelectorAll('.top-nav [data-view]'))b.setAttribute('aria-selected',String(b.dataset.view===next||(next==='detail'&&b.dataset.view==='orders')));if(next==='detail')renderDetail();if(next==='orders')renderOrders();if(next==='cart')destination();}
function controls(){const frozen=busy||!!pending;$('submit').disabled=!online||frozen||!cart.size||!$('staff').value||[...cart.values()].some(r=>{const p=product(r.productId);return !p||p.price==null||r.qty<1||r.qty>1000});$('retry').hidden=!pending;$('retry').disabled=busy;for(const id of ['staff','source','table','pickup','customer-name','customer-phone','customer-time','cancel-target'])$(id).disabled=frozen||(targetOrder!=null&&['source','table','pickup'].includes(id));for(const el of document.querySelectorAll('#cart button,#cart input,#menu button,#order-detail button,#orders button,#customize input,#customize textarea,#customize button,#payment-dialog input,#payment-dialog select,#payment-dialog button,#move-dialog select,#move-dialog button'))el.disabled=frozen||el.dataset.unpriced==='true'||el.dataset.locked==='true';}
function destination(){const table=openOrders().find(o=>o.source==='Masa'&&o.table===Number($('table').value));const text=targetOrder!=null?'Ek sipariş → #'+(order(targetOrder)?number(order(targetOrder)):targetOrder):$('source').value==='Masa'?(table?'Ek sipariş → Masa '+table.table+' · #'+number(table):'Yeni sipariş → Masa '+$('table').value):'Yeni Gel-Al · '+$('pickup').value;$('destination').textContent=text;$('cart-destination').textContent=text;$('target-bar').hidden=targetOrder==null;$('target-label').textContent=text;}
function render(){const selected=$('staff').value,sig=JSON.stringify(state.employees);if(sig!==staffSignature){staffSignature=sig;$('staff').innerHTML='<option value="">Adınızı seçin</option>'+state.employees.filter(e=>e.active).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');$('staff').value=selected}const table=$('table').value||'1',ts=JSON.stringify(openOrders().filter(o=>o.source==='Masa').map(o=>[o.table,o.id]));if(ts!==tableSignature||!$('table').options.length){tableSignature=ts;$('table').innerHTML=Array.from({length:5},(_,i)=>{const n=i+1,o=openOrders().find(o=>o.table===n);return `<option value="${n}">Masa ${n} · ${o?'Dolu':'Boş'}</option>`}).join('');$('table').value=table}const ms=JSON.stringify(state.localMenu);if(ms!==menuSignature){menuSignature=ms;renderCategories();renderMenu()}renderOrders();if(view==='detail')renderDetail();destination();total();}
function renderCategories(){const categories=[...new Set((state.localMenu||[]).filter(p=>p.active!==false).map(p=>p.category))];if(!categories.includes(category))category='all';$('categories').innerHTML=[['all','Tümü'],...categories.map(c=>[c,categoryNames[c]||c])].map(([id,name])=>`<button type="button" data-category="${esc(id)}" aria-pressed="${category===id}">${esc(name)}</button>`).join('')}
function renderMenu(){if(!state)return;const search=$('search').value.toLocaleLowerCase('tr-TR');$('menu').innerHTML=(state.localMenu||[]).filter(p=>p.active!==false&&(category==='all'||p.category===category)&&p.name.toLocaleLowerCase('tr-TR').includes(search)).map(p=>`<article class="product"><div class="grow"><strong class="name">${esc(p.name)}</strong><div class="row"><b class="price">${p.price==null?'Fiyat yok':money(Math.round(p.price*100))}</b><button class="custom-button" data-custom="${p.id}" data-unpriced="${p.price==null}">Not / Malzeme</button></div></div><button class="add-button" aria-label="${esc(p.name)} ekle" data-add="${p.id}" data-unpriced="${p.price==null}">+<span class="in-cart" data-product-count="${p.id}" hidden></span></button></article>`).join('')||'<p class="empty">Ürün bulunamadı.</p>';updateProductCounts();controls()}
function updateProductCounts(){for(const el of document.querySelectorAll('[data-product-count]')){const n=[...cart.values()].filter(r=>r.productId===Number(el.dataset.productCount)).reduce((a,r)=>a+r.qty,0);el.textContent=n;el.hidden=n===0;}}
function addLine(id,qty=1,note='',removed=[]){if(cart.size>=200){notice('Bir sipariş en fazla 200 ayrı satır içerebilir.');return}const p=product(id);if(!p||p.price==null||busy||pending)return;const same=[...cart.values()].find(r=>r.productId===id&&r.note===note&&r.removed.join(',')===removed.join(','));if(same){if(same.qty+qty>1000){notice('Adet en fazla 1000 olabilir');return}same.qty+=qty}else cart.set(++lineId,{productId:id,qty,note,removed,name:p.name});renderCart();total()}
function renderCart(){$('cart').innerHTML=[...cart].map(([key,r])=>`<article class="cart-line"><div class="cart-line-title"><strong>${esc(r.name)}</strong><button class="ghost danger" data-delete="${key}">Kaldır</button></div><div class="quantity"><button data-delta="-1" data-key="${key}" aria-label="Adedi azalt">−</button><b>${r.qty}</b><button data-delta="1" data-key="${key}" aria-label="Adedi artır">+</button></div><label>Not<input data-note="${key}" maxlength="500" value="${esc(r.note)}"></label><label>Çıkarılacak malzemeler<input data-removed="${key}" maxlength="500" value="${esc(r.removed.join(', '))}"></label><p data-line-status="${key}"></p></article>`).join('')||'<div class="empty"><strong>Sepet boş</strong><p>Menüden ürün ekle.</p></div>';controls()}
function total(){let sum=0;for(const[key,r]of cart){const p=product(r.productId);sum+=Math.round((p?.price||0)*100)*r.qty;const warning=document.querySelector(`[data-line-status="${key}"]`);if(warning)warning.textContent=!p||p.price==null?'Ürün satış dışı. Kaldırın.':money(Math.round(p.price*100)*r.qty)}const count=[...cart.values()].reduce((n,r)=>n+r.qty,0);$('total').textContent='Toplam '+money(sum);$('cart-count').textContent=count;$('dock-caption').textContent='Sipariş sepeti · '+count+' ürün';$('dock-total').textContent=money(sum);updateProductCounts();controls()}
function renderOrders(){const filter=$('order-filter').value,all=openOrders();$('order-count').textContent=all.length;const rows=all.filter(o=>filter==='all'||filter==='ready'&&o.serviceStatus==='Hazır'||o.source===filter).sort((a,b)=>(a.serviceStatus==='Hazır'?-1:0)-(b.serviceStatus==='Hazır'?-1:0)||String(a.createdAt).localeCompare(String(b.createdAt)));$('orders').innerHTML=rows.map(o=>`<article class="order"><div class="row spread"><strong class="order-number">#${number(o)} · ${o.table?'Masa '+o.table:esc(o.source)}</strong><span class="badge ${o.serviceStatus==='Hazır'?'ready':''}">${esc(o.serviceStatus||'Hazırlanıyor')}</span></div><div class="row spread"><span>${keyedLines(o).reduce((n,l)=>n+l.qty,0)} ürün</span><strong>Kalan ${money(orderDue(o))}</strong></div><button class="select-order" data-open="${o.id}">Hesabı Aç</button></article>`).join('')||'<p class="empty">Açık sipariş yok.</p>';controls()}
function renderDetail(){const o=order(focusedOrder);if(!o){$('order-detail').innerHTML='<div class="empty"><strong>Hesap kapalı veya güncellendi</strong><button data-view="orders">Siparişlere dön</button></div>';return}const paid=o.paidCents??0;$('order-detail').innerHTML=`<div class="row spread"><button data-view="orders" class="ghost">← Geri</button><span class="badge">${esc(o.serviceStatus||'Hazırlanıyor')}</span></div><h2>#${number(o)} · ${o.table?'Masa '+o.table:esc(o.source)}</h2><div class="detail-actions"><button data-existing-add="${o.id}">+ Ek ürün</button>${o.source==='Masa'?'<button id="move-order">Masayı taşı</button>':''}</div>${keyedLines(o).map(l=>`<div class="detail-line"><div class="grow"><strong>${l.qty} × ${esc(l.name||l.productKey)}</strong><p class="muted">${esc(l.note||'')}${l.removed?.length?' · Çıkar: '+esc(l.removed.join(', ')):''}</p><span class="line-price">${money(Math.round(l.price*100)*l.qty)}</span></div><button data-edit-line="${esc(l.key)}" aria-label="${esc(l.name)} düzenle">Düzenle</button><button data-remove-line="${esc(l.key)}" class="ghost danger" aria-label="${esc(l.name)} kaldır">×</button></div>`).join('')||'<p class="empty">Ürün yok</p>'}<div class="detail-totals"><p><span>Toplam</span><strong>${money(orderTotal(o))}</strong></p><p><span>Alınan</span><strong>${money(paid)}</strong></p><p><span>Kalan</span><strong>${money(orderDue(o))}</strong></p></div><div class="detail-actions">${['Hazırlanıyor','Hazır'].includes(o.serviceStatus)?`<button id="advance-status">${o.serviceStatus==='Hazır'?'Teslim Edildi':'Hazır'}</button>`:''}<button id="pay-order" class="primary" data-locked="${orderDue(o)<=0}">Nakit / Kart</button><button id="close-order" data-locked="${orderDue(o)>0}">Hesabı Kapat</button></div><p class="muted history-note">Değişiklikler aynı sipariş numarasına kaydedilir.</p>`;controls()}
function custom(id,line=null){customProduct=id;editing=line;const p=line||product(id);$('custom-name').textContent=p.name;$('custom-qty').value=line?.qty??1;$('custom-note').value=line?.note||'';$('custom-removed').value=(line?.removed||[]).join(', ');$('custom-error').textContent='';$('customize').showModal()}
function basePayload(){return{requestId:Date.now().toString(36)+'_'+Math.random().toString(36).slice(2),expectedRevision:revision,staffId:Number($('staff').value)}}
function startRequest(url,payload){if(busy||pending)return;if(!online||!$('staff').value){notice('Bağlantıyı ve çalışan seçimini kontrol edin');return}pending={url,payload:{...basePayload(),...payload}};sessionStorage.setItem('nohut-pending',JSON.stringify(pending));send()}
function action(name,fields={}){startRequest('/api/staff/actions',{action:name,orderId:focusedOrder,...fields})}
async function request(url,options,timeout){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);try{return await fetch(url,{...options,signal:controller.signal})}finally{clearTimeout(timer)}}
async function refresh(){if(busy||refreshing)return false;refreshing=true;try{const r=await request('/api/bootstrap',{cache:'no-store'},10000);if(!r.ok)throw Error();const b=await r.json();state=b.state;revision=b.revision;online=true;render();$('connection').textContent='● Laptop bağlı';return true}catch{online=false;$('connection').textContent='● Bağlantı yok · Sepet korunuyor';controls();return false}finally{refreshing=false}}
async function send(){if(!pending||busy)return;busy=true;notice('Kaydediliyor…');controls();const current=pending;try{const r=await request(current.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(current.payload)},15000);const b=await r.json();if(r.status===409){pending=null;sessionStorage.removeItem('nohut-pending');notice('Başka cihaz değişiklik yaptı. Sepet korundu. Güncel hesabı kontrol edip yeniden kaydedin.');return}if(!r.ok){pending=null;sessionStorage.removeItem('nohut-pending');notice(b.message||'İstek reddedildi.');return}pending=null;sessionStorage.removeItem('nohut-pending');if(current.url==='/api/staff/orders'){cart.clear();targetOrder=null;renderCart();setView('orders')}for(const id of ['customize','payment-dialog','move-dialog'])if($(id).open)$(id).close();notice('✓ Sipariş #'+(b.orderNumber??b.orderId)+' kaydedildi.');revision=b.revision;}catch{online=false;notice('Onay alınamadı. Aynı isteği yeniden deneyin; çift işlem oluşturulmaz.')}finally{busy=false;controls();if(!pending)await refresh()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});
$('menu').onclick=e=>{const b=e.target.closest('button');if(!b||busy||pending)return;if(b.dataset.add!=null)addLine(Number(b.dataset.add));if(b.dataset.custom!=null)custom(Number(b.dataset.custom))};
$('categories').onclick=e=>{const b=e.target.closest('[data-category]');if(b){category=b.dataset.category;renderCategories();renderMenu()}};
$('cart').onclick=e=>{const b=e.target.closest('button');if(!b||busy||pending)return;if(b.dataset.delete!=null)cart.delete(Number(b.dataset.delete));if(b.dataset.delta!=null){const key=Number(b.dataset.key),r=cart.get(key);r.qty=Math.min(1000,r.qty+Number(b.dataset.delta));if(r.qty<=0)cart.delete(key)}renderCart();total()};
$('cart').oninput=e=>{if(busy||pending)return;const el=e.target,key=el.dataset.note??el.dataset.removed;if(key==null)return;const row=cart.get(Number(key));if(el.dataset.note!=null)row.note=el.value;else row.removed=el.value.split(',').map(s=>s.trim()).filter(Boolean)};
$('custom-form').onsubmit=e=>{e.preventDefault();const qty=Number($('custom-qty').value),note=$('custom-note').value,removed=$('custom-removed').value.split(',').map(s=>s.trim()).filter(Boolean);if(!Number.isInteger(qty)||qty<0||qty>1000)return;if(editing){action('editLine',{key:editing.key,qty,note,removed})}else{if(qty<1){$('custom-error').textContent='Adet en az 1 olmalı';return}addLine(customProduct,qty,note,removed);$('customize').close()}};$('custom-cancel').onclick=()=>$('customize').close();
$('staff').onchange=controls;$('table').onchange=destination;$('pickup').onchange=destination;
$('source').onchange=()=>{$('table-label').hidden=$('source').value!=='Masa';$('pickup-label').hidden=$('source').value!=='Gel-Al';$('customer').hidden=$('source').value!=='Gel-Al';destination()};$('search').oninput=renderMenu;$('order-filter').onchange=renderOrders;
$('orders').onclick=e=>{const b=e.target.closest('[data-open]');if(b){focusedOrder=Number(b.dataset.open);setView('detail')}};
$('order-detail').onclick=e=>{const b=e.target.closest('button');if(!b||busy||pending)return;const o=order(focusedOrder);if(!o)return;if(b.dataset.existingAdd!=null){targetOrder=o.id;$('source').value=o.source;$('table').value=String(o.table||1);$('source').onchange();setView('menu');controls()}if(b.dataset.editLine!=null){const l=keyedLines(o).find(l=>l.key===b.dataset.editLine);custom(l.productId,l)}if(b.dataset.removeLine!=null){const l=keyedLines(o).find(l=>l.key===b.dataset.removeLine);if(confirm(l.name+' kaldırılsın mı?'))action('editLine',{key:l.key,qty:0,note:l.note||'',removed:l.removed||[]})}if(b.id==='advance-status')action('status',{status:o.serviceStatus==='Hazır'?'Teslim Edildi':'Hazır'});if(b.id==='close-order'&&confirm('Ödenmiş hesap kapatılsın mı?'))action('close');if(b.id==='pay-order'){if(o.guestChecks?.length){notice('Kişi paylı ödemeyi laptop üzerinden tamamlayın');return}$('payment-form').reset();$('pay-amount').value=(orderDue(o)/100).toFixed(2);$('pay-received').value=(orderDue(o)/100).toFixed(2);$('payment-due').textContent='Kalan '+money(orderDue(o));$('payment-error').textContent='';paymentFields();$('payment-dialog').showModal()}if(b.id==='move-order'){$('move-table').innerHTML=Array.from({length:5},(_,i)=>i+1).filter(n=>n!==o.table&&!openOrders().some(x=>x.table===n)).map(n=>`<option value="${n}">Masa ${n} · Boş</option>`).join('');$('move-error').textContent='';$('move-dialog').showModal()}};
function parseMoney(value){const s=value.trim().replace(',','.');if(!/^\d{1,9}(\.\d{1,2})?$/.test(s))throw Error('Tutarı doğru girin');const [whole,decimal='']=s.split('.');return Number(whole)*100+Number(decimal.padEnd(2,'0'))}
function paymentFields(){const cash=$('pay-method').value==='Nakit';$('cash-label').hidden=!cash;$('card-check').hidden=cash;$('cash-change').hidden=!cash;try{const change=parseMoney($('pay-received').value)-parseMoney($('pay-amount').value);$('cash-change').textContent=change<0?'Alınan nakit yetersiz':'Para üstü '+money(change)}catch{$('cash-change').textContent='Tutarı girin'}}
$('pay-method').onchange=paymentFields;$('pay-amount').oninput=paymentFields;$('pay-received').oninput=paymentFields;$('pay-cancel').onclick=()=>$('payment-dialog').close();
$('payment-form').onsubmit=e=>{e.preventDefault();try{const amount=parseMoney($('pay-amount').value),method=$('pay-method').value,received=method==='Nakit'?parseMoney($('pay-received').value):null,o=order(focusedOrder);if(amount<=0||amount>orderDue(o))throw Error('Kalan tutarı aşmayın');if(method==='Nakit'&&received<amount)throw Error('Alınan nakit yetersiz');if(method==='Kart'&&!$('card-confirmed').checked)throw Error('Terminalde başarılı ödemeyi doğrulayın');if(!$('pay-print').value)throw Error('Fiş seçimini yapın');if(!confirm(money(amount)+' '+method+' ödemesi alındı mı?'))return;action('pay',{amountCents:amount,method,receivedCents:received,confirmed:true,printReceipt:$('pay-print').value==='yes'})}catch(err){$('payment-error').textContent=err.message}};
$('move-cancel').onclick=()=>$('move-dialog').close();$('move-form').onsubmit=e=>{e.preventDefault();if(!$('move-table').value){$('move-error').textContent='Boş masa yok';return}action('move',{table:Number($('move-table').value)})};
$('cancel-target').onclick=()=>{targetOrder=null;destination();controls()};
$('submit').onclick=()=>{if($('submit').disabled)return;startRequest('/api/staff/orders',{...(targetOrder!=null?{orderId:targetOrder}:{}),source:$('source').value,table:$('source').value==='Masa'?Number($('table').value):null,pickupChannel:$('pickup').value,customer:{name:$('customer-name').value,phone:$('customer-phone').value,time:$('customer-time').value},lines:[...cart.values()].map(({productId,qty,note,removed})=>({productId,qty,note,removed}))})};$('retry').onclick=send;$('reload').onclick=refresh;
if(pending?.url==='/api/staff/orders'){for(const row of pending.payload.lines||[])cart.set(++lineId,{...row,name:'Ürün #'+row.productId});$('source').value=pending.payload.source;$('pickup').value=pending.payload.pickupChannel||'Tezgahtan';targetOrder=pending.payload.orderId??null;for(const k of ['name','phone','time'])$('customer-'+k).value=pending.payload.customer?.[k]||'';setView('cart')}
if(pending)notice('Önceki işlemin onayı bekleniyor. Aynı isteği yeniden deneyin.');renderCart();refresh().then(()=>{if(pending){$('staff').value=String(pending.payload.staffId);$('table').value=String(pending.payload.table||1);focusedOrder=pending.payload.orderId??null;for(const r of cart.values())r.name=product(r.productId)?.name||r.name;renderCart();$('source').onchange()}});setInterval(refresh,5000);
</script></body></html>
