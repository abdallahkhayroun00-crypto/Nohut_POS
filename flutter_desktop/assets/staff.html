<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nohut Falafel · Personel</title>
<style>
:root{--green:#123e30;--gold:#a58336;--cream:#f6f2e7}*{box-sizing:border-box}body{font:16px system-ui;background:var(--cream);color:var(--green);margin:0 auto;max-width:780px;padding:16px 16px 80px}header,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header img{width:64px;height:64px;object-fit:contain}h1{font-size:24px;margin:0}h2{font-size:20px}section{background:white;padding:16px;border:1px solid #d8dfd4;border-radius:16px;margin:14px 0}button,input,select,textarea{font:inherit;min-height:44px;padding:10px;border:1px solid #9cae9e;border-radius:8px}input,textarea{width:100%;margin:4px 0}button{background:#edf2e9;color:var(--green);cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:8px 0}select{max-width:100%}.product,.cart-line,.order{border-bottom:1px solid #dde7dc;padding:12px 0}.name{flex:1 1 160px}.muted{font-size:14px;color:#526251;line-height:1.5}#notice{position:sticky;top:8px;z-index:3;background:#fff0cc;padding:12px;border:1px solid var(--gold);border-radius:10px}#notice:empty{display:none}#submit{width:100%;background:var(--green);color:white;font-weight:700;margin:8px 0}#categories{display:flex;gap:6px;overflow:auto;padding:8px 0}#categories button{white-space:nowrap}#categories [aria-pressed=true]{background:var(--green);color:white}.order ul{padding-left:22px;line-height:1.6}dialog{width:min(480px,calc(100% - 24px));border:1px solid #b9c7b8;border-radius:16px;padding:20px;max-height:90dvh;overflow:auto}dialog::backdrop{background:#123e3070}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}[hidden]{display:none!important}
</style></head><body>
<header><img src="/assets/nohut-logo.webp" alt="Nohut Falafel"><div><h1>Personel Paneli</h1><div id="connection" role="status">Laptopa bağlanılıyor…</div></div></header><p id="notice" role="status" aria-live="polite"></p>
<section><label>Çalışan <select id="staff"><option value="">Adınızı seçin</option></select></label><p class="muted">Her kullanımda kendi adınızı seçin. Ödeme ve kasa işlemleri Windows PC üzerindedir.</p><div class="row"><label>Sipariş <select id="source"><option>Masa</option><option>Gel-Al</option></select></label><label id="table-label">Masa <select id="table"></select></label><label id="pickup-label" hidden>Teslim alma <select id="pickup"><option>Tezgahtan</option><option>Telefon</option></select></label></div><p id="destination"></p><div id="customer" hidden><label>Müşteri adı<input id="customer-name" autocomplete="name"></label><label>Telefon<input id="customer-phone" type="tel"></label><label>Teslim alma saati<input id="customer-time" type="time"></label></div></section>
<section><label>Ürün ara<input id="search" type="search"></label><nav id="categories" aria-label="Ürün kategorileri"></nav><div id="menu"></div></section>
<section><h2>Sipariş Sepeti</h2><div id="cart"></div><h2 id="total">Toplam 0,00 ₺</h2><button id="submit" disabled>Siparişi Laptopa Kaydet</button><button id="retry" hidden>Aynı İsteği Yeniden Dene</button><button id="reload">Bağlantıyı Yenile</button><p class="muted">Sipariş numarası görünmeden kayıt tamamlanmış sayılmaz. Bağlantı kesilirse aynı isteği yeniden deneyin.</p></section>
<section><h2>Açık Siparişler</h2><label>Göster<select id="order-filter"><option value="all">Tümü</option><option value="Masa">Masalar</option><option value="Gel-Al">Gel-Al</option><option value="ready">Hazır</option></select></label><div id="orders"></div></section>
<dialog id="customize"><form id="custom-form"><h2 id="custom-name"></h2><label>Adet<input id="custom-qty" type="number" min="1" max="1000" value="1" required></label><label>Ürün notu<textarea id="custom-note" maxlength="500"></textarea></label><label>Çıkarılacak malzemeler<input id="custom-removed" maxlength="500" placeholder="Virgülle ayırın"></label><div class="row"><button type="button" id="custom-cancel">Vazgeç</button><button type="submit">Sepete Ekle</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),cart=new Map();let state=null,revision=-1,busy=false,online=false,refreshing=false,category='all',lineId=0,customProduct=null,menuSignature='',staffSignature='',tableSignature='';
let pending=null;try{pending=JSON.parse(sessionStorage.getItem('nohut-pending')||'null')}catch{sessionStorage.removeItem('nohut-pending')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
const number=o=>String(o.dailyNumber??o.id).padStart(4,'0');
const categoryNames={wrap:'Dürümler',plate:'Porsiyonlar',meze:'Mezeler',fatte:'Fatte',side:'Diğer',salad:'Salatalar',dessert:'Tatlılar',drink:'İçecekler'};
const lines=o=>(o.batches||[]).flatMap(b=>b.lines||[]).filter(l=>!l.voided&&!l.correction);
const openOrders=()=>state?.orders.filter(o=>!o.closed&&!o.cancelled&&!o.tableReleased&&['Masa','Gel-Al'].includes(o.source))||[];
const product=id=>state?.localMenu.find(p=>p.id===id&&p.active!==false);
function notice(text){$('notice').textContent=text}
function controls(){const frozen=busy||!!pending;$('submit').disabled=!online||frozen||!cart.size||!$('staff').value||[...cart.values()].some(r=>{const p=product(r.productId);return !p||p.price==null||r.qty<1||r.qty>1000});$('retry').hidden=!pending;$('retry').disabled=busy;for(const id of ['staff','source','table','pickup','customer-name','customer-phone','customer-time'])$(id).disabled=frozen;for(const el of document.querySelectorAll('#cart button,#cart input,#menu button'))el.disabled=frozen||el.dataset.unpriced==='true'}
function destination(){const table=openOrders().find(o=>o.source==='Masa'&&o.table===Number($('table').value));$('destination').textContent=$('source').value==='Masa'?(table?'Ek sipariş → Masa '+table.table+' · #'+number(table):'Yeni sipariş → Masa '+$('table').value):'Yeni Gel-Al · '+$('pickup').value}
function render(){
 const selected=$('staff').value,sig=JSON.stringify(state.employees);if(sig!==staffSignature){staffSignature=sig;$('staff').innerHTML='<option value="">Adınızı seçin</option>'+state.employees.filter(e=>e.active).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');$('staff').value=selected}
 const table=$('table').value||'1',ts=JSON.stringify(openOrders().filter(o=>o.source==='Masa').map(o=>[o.table,o.id]));if(ts!==tableSignature||!$('table').options.length){tableSignature=ts;$('table').innerHTML=Array.from({length:5},(_,i)=>{const n=i+1,o=openOrders().find(o=>o.table===n);return `<option value="${n}">Masa ${n} · ${o?'Dolu · Ek sipariş':'Boş'}</option>`}).join('');$('table').value=table}
 const ms=JSON.stringify(state.localMenu);if(ms!==menuSignature){menuSignature=ms;renderCategories();renderMenu()}renderOrders();destination();total();
}
function renderCategories(){const categories=[...new Set((state.localMenu||[]).filter(p=>p.active!==false).map(p=>p.category))];if(!categories.includes(category))category='all';$('categories').innerHTML=[['all','Tümü'],...categories.map(c=>[c,categoryNames[c]||c])].map(([id,name])=>`<button type="button" data-category="${esc(id)}" aria-pressed="${category===id}">${esc(name)}</button>`).join('')}
function renderMenu(){if(!state)return;const search=$('search').value.toLocaleLowerCase('tr-TR');$('menu').innerHTML=(state.localMenu||[]).filter(p=>p.active!==false&&(category==='all'||p.category===category)&&p.name.toLocaleLowerCase('tr-TR').includes(search)).map(p=>`<article class="product"><div class="row"><strong class="name">${esc(p.name)}</strong><b>${p.price==null?'Fiyat yok':money(Math.round(p.price*100))}</b></div><div class="row"><button type="button" data-add="${p.id}" data-unpriced="${p.price==null}">+ Ekle</button><button type="button" data-custom="${p.id}" data-unpriced="${p.price==null}">Not / Malzeme</button></div></article>`).join('')||'<p>Ürün bulunamadı.</p>';controls()}
function addLine(id,qty=1,note='',removed=[]){const p=product(id);if(!p||p.price==null||busy||pending)return;cart.set(++lineId,{productId:id,qty,note,removed,name:p.name});renderCart();total()}
function renderCart(){$('cart').innerHTML=[...cart].map(([key,r])=>`<article class="cart-line"><strong>${esc(r.name||product(r.productId)?.name||'Ürün')}</strong><div class="row"><button data-delta="-1" data-key="${key}" aria-label="Adedi azalt">−</button><b>${r.qty}</b><button data-delta="1" data-key="${key}" aria-label="Adedi artır">+</button><button data-delete="${key}">Kaldır</button></div><label>Not<input data-note="${key}" maxlength="500" value="${esc(r.note)}"></label><label>Çıkarılacak malzemeler<input data-removed="${key}" maxlength="500" value="${esc(r.removed.join(', '))}"></label><p class="muted" data-line-status="${key}"></p></article>`).join('')||'<p class="muted">Sepet boş. Aynı ürünü farklı notlarla ayrı ayrı ekleyebilirsiniz.</p>';controls()}
function total(){let sum=0;for(const [key,r]of cart){const p=product(r.productId);sum+=Math.round((p?.price||0)*100)*r.qty;const warning=document.querySelector(`[data-line-status="${key}"]`);if(warning)warning.textContent=!p||p.price==null?'Bu ürün artık satışta değil. Sepetten kaldırın.':money(Math.round(p.price*100)*r.qty)}$('total').textContent='Toplam '+money(sum);controls()}
function renderOrders(){const filter=$('order-filter').value;const rows=openOrders().filter(o=>filter==='all'||filter==='ready'&&o.serviceStatus==='Hazır'||o.source===filter).sort((a,b)=>(a.serviceStatus==='Hazır'?-1:0)-(b.serviceStatus==='Hazır'?-1:0)||String(a.createdAt).localeCompare(String(b.createdAt)));$('orders').innerHTML=rows.map(o=>`<article class="order"><strong>#${number(o)} · ${esc(o.source)} ${o.table?'· Masa '+o.table:''}</strong><p class="muted">${esc(o.numberDay||'')} · ${esc(o.serviceStatus||'Hazırlanıyor')}${o.customer?.name?' · '+esc(o.customer.name):''}</p><ul>${lines(o).map(l=>`<li><b>${l.qty} × ${esc(l.name||l.productKey)}</b>${l.note?'<br>Not: '+esc(l.note):''}${l.removed?.length?'<br>Çıkar: '+esc(l.removed.join(', ')):''}</li>`).join('')}</ul>${o.source==='Masa'?`<button data-table="${o.table}">Bu Masaya Ek Sipariş</button>`:''}</article>`).join('')||'<p>Açık sipariş yok.</p>'}
$('menu').onclick=e=>{const b=e.target.closest('button');if(!b||busy||pending)return;if(b.dataset.add!=null)addLine(Number(b.dataset.add));if(b.dataset.custom!=null){customProduct=Number(b.dataset.custom);$('custom-name').textContent=product(customProduct).name;$('custom-form').reset();$('customize').showModal()}};
$('categories').onclick=e=>{const b=e.target.closest('[data-category]');if(b){category=b.dataset.category;renderCategories();renderMenu()}};
$('cart').onclick=e=>{const b=e.target.closest('button');if(!b||busy||pending)return;if(b.dataset.delete!=null)cart.delete(Number(b.dataset.delete));if(b.dataset.delta!=null){const key=Number(b.dataset.key),r=cart.get(key);r.qty=Math.min(1000,r.qty+Number(b.dataset.delta));if(r.qty<=0)cart.delete(key)}renderCart();total()};
$('cart').oninput=e=>{if(busy||pending)return;const el=e.target,key=el.dataset.note??el.dataset.removed;if(key==null)return;const row=cart.get(Number(key));if(el.dataset.note!=null)row.note=el.value;else row.removed=el.value.split(',').map(s=>s.trim()).filter(Boolean)};
$('custom-form').onsubmit=e=>{e.preventDefault();const qty=Number($('custom-qty').value);if(!Number.isInteger(qty)||qty<1||qty>1000)return;addLine(customProduct,qty,$('custom-note').value,$('custom-removed').value.split(',').map(s=>s.trim()).filter(Boolean));$('customize').close()};$('custom-cancel').onclick=()=>$('customize').close();
$('staff').onchange=controls;$('table').onchange=destination;$('pickup').onchange=destination;
$('source').onchange=()=>{$('table-label').hidden=$('source').value!=='Masa';$('pickup-label').hidden=$('source').value!=='Gel-Al';$('customer').hidden=$('source').value!=='Gel-Al';destination()};$('search').oninput=renderMenu;$('order-filter').onchange=renderOrders;
$('orders').onclick=e=>{const b=e.target.closest('[data-table]');if(!b||busy||pending)return;$('source').value='Masa';$('table').value=b.dataset.table;$('source').onchange();$('destination').scrollIntoView({behavior:'smooth',block:'center'})};
async function refresh(){if(busy||refreshing)return false;refreshing=true;try{const r=await fetch('/api/bootstrap',{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error();const b=await r.json();state=b.state;revision=b.revision;online=true;render();$('connection').textContent='● Laptop bağlı · '+new Date().toLocaleTimeString('tr-TR');return true}catch{online=false;$('connection').textContent='● Bağlantı yok · Sepet korunuyor';controls();return false}finally{refreshing=false}}
async function send(){if(!pending||busy)return;busy=true;notice('Kaydediliyor…');controls();try{
 const r=await fetch('/api/staff/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pending),signal:AbortSignal.timeout(15000)});const b=await r.json();
 if(r.status===409){pending=null;sessionStorage.removeItem('nohut-pending');notice('Başka cihaz değişiklik yaptı. Sepet korundu. Güncel masa ve fiyatları kontrol edip yeniden kaydedin.');busy=false;await refresh();return}
 if(!r.ok){pending=null;sessionStorage.removeItem('nohut-pending');notice(b.message||'İstek reddedildi. Sepeti kontrol edin.');return}
 pending=null;sessionStorage.removeItem('nohut-pending');cart.clear();renderCart();notice('✓ Sipariş #'+(b.orderNumber??b.orderId)+' kaydedildi.');revision=b.revision;
 }catch{online=false;notice('Onay alınamadı. Aynı isteği yeniden deneyin; çift sipariş oluşturulmaz.')}finally{busy=false;controls()}if(!pending)await refresh();
}
$('submit').onclick=()=>{if($('submit').disabled)return;pending={requestId:Date.now().toString(36)+'_'+Math.random().toString(36).slice(2),expectedRevision:revision,staffId:Number($('staff').value),source:$('source').value,table:$('source').value==='Masa'?Number($('table').value):null,pickupChannel:$('pickup').value,customer:{name:$('customer-name').value,phone:$('customer-phone').value,time:$('customer-time').value},lines:[...cart.values()].map(({productId,qty,note,removed})=>({productId,qty,note,removed}))};sessionStorage.setItem('nohut-pending',JSON.stringify(pending));send()};$('retry').onclick=send;$('reload').onclick=refresh;
if(pending){for(const row of pending.lines||[])cart.set(++lineId,{...row,name:'Ürün #'+row.productId});$('source').value=pending.source;$('pickup').value=pending.pickupChannel||'Tezgahtan';$('customer-name').value=pending.customer?.name||'';$('customer-phone').value=pending.customer?.phone||'';$('customer-time').value=pending.customer?.time||'';notice('Önceki siparişin onayı bekleniyor. Aynı isteği yeniden deneyin.');renderCart()}
refresh().then(()=>{if(pending){$('staff').value=String(pending.staffId);$('table').value=String(pending.table||1);for(const row of cart.values())row.name=product(row.productId)?.name||row.name;renderCart();$('source').onchange()}});setInterval(refresh,5000);
</script></body></html>
