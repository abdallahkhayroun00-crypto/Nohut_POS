name: nohut_falafel_desktop
description: Nohut Falafel Windows POS desktop with local SQLite and employee QR LAN.
publish_to: none
version: 0.6.7+13

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  ffi: ^2.2.0
  sqlite3: ^3.7.1
  qr_flutter: ^4.1.0
  file_selector: ^1.1.0
  pdf: 3.12.0
  # image 4.11.0 incorrectly permits archive 4.0.9 (missing decodeLazy).
  # 4.11.1 fixes the archive >=4.4.0 constraint for Flutter tests.
  image: 4.11.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/menu.json
    - assets/staff.html
    - assets/printing/
    - assets/brand/
    - assets/notifications/
    - assets/brand/fonts/
  fonts:
    - family: Barlow Semi Condensed
      fonts:
        - asset: assets/brand/fonts/Barlow-Regular.ttf
        - asset: assets/brand/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/brand/fonts/Barlow-Bold.ttf
          weight: 700
    - family: Bree Serif
      fonts:
        - asset: assets/brand/fonts/BreeSerif-Regular.ttf

