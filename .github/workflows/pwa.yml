name: Nohut PWAs (Personel + Yönetici)

# Two installable web apps from pwa/ (spec V5.1 §8.2, §20.1). Pull requests
# are type-checked, tested and built. Changes merged to main are deployed to
# two separate Cloudflare Pages projects (free plan, permanent HTTPS
# *.pages.dev addresses). Only the Supabase PUBLISHABLE key is embedded
# (public by design); no privileged key ever reaches the browser.
on:
  pull_request:
    paths:
      - 'pwa/**'
      - 'docs/contracts/**'
      - '.github/workflows/pwa.yml'
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - 'docs/contracts/**'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nohut-pwa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Build both apps
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Refuse privileged keys in the bundle
        run: |
          if grep -rIl -E 'service_role|sb_secret_' dist; then
            echo "::error::A privileged Supabase key reached the PWA bundle."
            exit 1
          fi
      - name: Refuse synthetic fixtures and Windows-only sections in production
        run: |
          if grep -rIl -E 'TG-90412|YS-55120|Örnek Müşteri' dist; then
            echo "::error::Synthetic fixture data reached a production bundle (spec §22.5)."
            exit 1
          fi
          if grep -rIl -E 'Şimdi Yedekle|Şimdi Senkronize Et|Yedekleme & Geri Yükleme|Bulut & Senkronizasyon' dist; then
            echo "::error::A Windows-only technical section reached a mobile/web bundle (spec §22.3)."
            exit 1
          fi
      - name: Build labelled synthetic preview (not deployed)
        run: npm run build:fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: nohut-pwa-dist
          path: pwa/dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nohut-pwa-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for app in personel yonetici; do
            project="nohut-$app"
            # Creates the Direct Upload project once; harmless if it exists.
            npx --yes wrangler@4.160.0 pages project create "$project" --production-branch main >/dev/null 2>&1 || true
            npx --yes wrangler@4.160.0 pages deploy "dist/$app" --project-name "$project" --branch main --commit-dirty=true | tee "deploy-$app.log"
          done
          echo "### Nohut PWAs" >> "$GITHUB_STEP_SUMMARY"
          grep -ho 'https://[a-z0-9.-]*pages\.dev' deploy-*.log | sort -u >> "$GITHUB_STEP_SUMMARY" || true
