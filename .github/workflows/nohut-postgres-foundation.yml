name: Test Nohut PostgreSQL foundation
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/phase2-postgres-foundation, chatgpt/pr-05b-cloud-rpcs]
    paths:
      - 'supabase/**'
      - '.github/workflows/nohut-postgres-foundation.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/nohut-postgres-foundation.yml'
permissions:
  contents: read
jobs:
  synthetic-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: nohut_synthetic
        options: >-
          --health-cmd "pg_isready -U postgres -d nohut_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration and verify fail-closed schema
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          psql_ci() {
            docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d nohut_synthetic "$@"
          }
          psql_ci -c 'create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls;'
          psql_ci < supabase/ci/supabase_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql_ci < "$f"; done
          for f in supabase/tests/*.sql; do psql_ci < "$f"; done
          echo 'PASS: PostgreSQL integrated synthetic tests (no live Supabase connection)' >> "$GITHUB_STEP_SUMMARY"

      - name: Cloud primitives under migration owner without BYPASSRLS
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          run_pg() { docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 "$@"; }
          run_pg -U postgres -d nohut_synthetic -c 'create role cloud_migrator login nosuperuser nobypassrls; grant authenticated, anon to cloud_migrator;'
          run_pg -U postgres -d nohut_synthetic -c 'create database nohut_cloud_plain owner cloud_migrator'
          run_pg -U postgres -d nohut_cloud_plain < supabase/ci/supabase_auth_stub.sql
          for f in supabase/migrations/*.sql; do run_pg -U cloud_migrator -d nohut_cloud_plain < "$f"; done
          for f in command_queue_test employee_ingest_test sync_validation_test authorized_enqueue_test authorized_claim_test command_canonical_json_test windows_agent_test; do
            run_pg -U cloud_migrator -d nohut_cloud_plain < "supabase/tests/$f.sql"
          done
          echo 'PASS: private cloud functions as plain migration owner' >> "$GITHUB_STEP_SUMMARY"
