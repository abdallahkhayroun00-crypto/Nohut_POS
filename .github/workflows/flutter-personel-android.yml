name: Build Nohut Personel Native Android APK

on:
  push:
    branches: ['**']
    paths:
      - 'flutter_personel/**'
      - 'packages/nohut_core/**'
      - 'flutter_desktop/lib/mobile_pairing.dart'
      - 'flutter_desktop/lib/lan_server.dart'
      - '.github/workflows/flutter-personel-android.yml'
  pull_request:
    paths:
      - 'flutter_personel/**'
      - 'packages/nohut_core/**'
      - 'flutter_desktop/lib/mobile_pairing.dart'
      - 'flutter_desktop/lib/lan_server.dart'
      - '.github/workflows/flutter-personel-android.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      require_signing:
        description: Fail unless the permanent release signing key is configured
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nohut-personel-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Android platform
        working-directory: flutter_personel
        run: flutter create --platforms android --org com.nohutfalafel --project-name nohut_personel .
      - name: Configure Android and launcher branding
        working-directory: flutter_personel
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/configure_android.py
          python3 tool/brand_icon.py
      - name: Refuse temporary signing for releases
        if: ${{ inputs.require_signing && env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::Release APKs must be signed with the permanent key. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (docs/cloud-sync/owner-setup-guide.md)."
          exit 1
      - name: Cache Gradle downloads (avoids Maven rate limits)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter_personel/pubspec.yaml', 'flutter_personel/tool/configure_android.py') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Permanent release signing key (when configured)
        # Without a fixed key each build is signed differently and installed
        # apps cannot be updated in place. The key lives only in GitHub
        # Secrets (owner action); it is never committed.
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: flutter_personel
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nohut-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nohut-release.jks" >> "$GITHUB_ENV"
          python3 tool/configure_android.py --signing
      - name: Install Flutter packages
        working-directory: flutter_personel
        run: flutter pub get
      - name: Dart static analysis
        working-directory: flutter_personel
        run: flutter analyze --no-fatal-infos
      - name: Native UI and pairing tests
        working-directory: flutter_personel
        run: flutter test --reporter expanded
      - name: Build native release APK
        working-directory: flutter_personel
        # Maven Central can answer HTTP 429; retry with growing backoff.
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release; then exit 0; fi
            echo "Build attempt $attempt failed; retrying after $((attempt * 60)) s"
            sleep $((attempt * 60))
          done
          exit 1
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Nohut-Personel-Android-APK
          path: flutter_personel/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
